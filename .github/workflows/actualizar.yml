name: Actualizar datos
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Actualizar datos · manual'
  || github.event.schedule == '10 5 * * 0' && 'Actualizar datos · semanal'
  || 'Actualizar datos · diaria' }}

# Cada día: trae las votaciones nuevas de cada fuente (la ONU, 20 parlamentos nacionales y el Congreso de
# España vía Escrutinio), hace con DeepSeek las fichas de lo nuevo (resumen, tema y relaciones con otros
# países), recalcula relaciones y afinidades y publica la web con los datos del día. En el repositorio
# guarda cada día solo las fichas (data/llm, texto pequeño), que es lo que no se puede volver a descargar;
# los domingos, y al lanzarlo a mano, también la base troceada (data/bd) y los datos de la web (web/datos),
# para que el historial de git no sume cada día una copia binaria.
#
# Entre un guardado y otro, la base de trabajo (data/concordia.sqlite) pasa de una ejecución a la siguiente
# en la caché de Actions: cada una sigue donde lo dejó la anterior, sin volver a traer lo de la semana (y una
# recogida por tandas, como la de Noruega, avanza cada día). La clave lleva la huella de data/bd y de db.py:
# cuando cambian (el guardado del domingo, datos subidos desde un equipo, un esquema nuevo), la base se
# reconstruye desde data/bd, para no pisar lo subido con una base vieja. Si no hay caché (GitHub la borra a
# los 7 días sin uso), se parte del último data/bd guardado y se vuelve a traer lo de desde entonces.
#
# Si la actualización falla o se pasa de tiempo, se guardan igualmente las fichas hechas (data/llm), que
# ya están pagadas, pero no la base ni la web, que podrían estar a medias, y no se publica.
#
# Configuración en Settings > Secrets and variables > Actions:
#   Secret   DEEPSEEK_API_KEY   clave de la API de DeepSeek (sin ella se actualiza todo menos las fichas IA)
#   Variable DEEPSEEK_MODEL     modelo (opcional; por defecto deepseek-flash)

on:
  schedule:
    - cron: "10 5 * * 1-6"   # diaria (07:10 en verano, hora peninsular)
    - cron: "10 5 * * 0"     # semanal (domingo): guarda también la base y la web
  workflow_dispatch:
    inputs:
      limite_fichas:
        description: "Máximo de fichas IA nuevas en esta ejecución"
        default: "300"
      fuente:
        description: "Solo estas fuentes, separadas por comas (vacío: todas)"
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    # Versión fija: Playwright (--with-deps) y Python 3.12 están probados aquí. ubuntu-latest pasa a
    # Ubuntu 26 desde el 19 de octubre de 2026; cambiarlo cuando se haya probado.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      COMPLETA: ${{ github.event_name != 'schedule' || github.event.schedule == '10 5 * * 0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # --with-deps instala también xvfb, que hace falta para abrir Chrome con ventana (ONU).
      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # La clave se calcula antes de actualizar, con data/bd tal como está en git: la actualización lo reescribe.
      - name: Clave de la caché
        id: cache
        run: echo "clave=base-${{ hashFiles('data/bd/manifiesto.json', 'data/bd/estado.json', 'concordia/db.py') }}" >> "$GITHUB_OUTPUT"

      - name: Recuperar la base de trabajo de la ejecución anterior
        uses: actions/cache/restore@v6
        with:
          path: data/concordia.sqlite*
          key: ${{ steps.cache.outputs.clave }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.clave }}-

      # Con su propio límite, por debajo del del trabajo: si se pasa, el paso falla (no se cancela el
      # trabajo) y el siguiente guarda las fichas hechas hasta entonces.
      - name: Actualizar
        id: actualizar
        timeout-minutes: 130
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          PYTHONUNBUFFERED: "1"
          LIMITE_FICHAS: ${{ inputs.limite_fichas || '300' }}
          FUENTE: ${{ inputs.fuente }}
        run: |
          args=(--limite-fichas "$LIMITE_FICHAS")
          fuente="${FUENTE// /}"   # «onu, usa» -> «onu,usa»
          if [ -n "$fuente" ]; then args+=(--fuente "$fuente"); fi
          xvfb-run --auto-servernum python -m concordia actualizar "${args[@]}"

      # La web se publica con los datos recién calculados, también los días que no se guardan en git.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      # Solo una base completa, y no cuando se guarda data/bd: entonces la huella cambia y la próxima
      # ejecución la reconstruye desde lo guardado (una caché con la clave vieja no le serviría).
      - name: Guardar la base de trabajo para la próxima ejecución
        if: ${{ steps.actualizar.outcome == 'success' && env.COMPLETA != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: data/concordia.sqlite*
          key: ${{ steps.cache.outputs.clave }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar cambios en el repositorio
        if: ${{ !cancelled() }}
        env:
          RESULTADO: ${{ steps.actualizar.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/llm
          if [ "$RESULTADO" != "success" ]; then
            echo "::warning title=Actualización incompleta::se guardan solo las fichas IA (data/llm)"
          elif [ "$COMPLETA" = "true" ]; then
            git add data/bd web/datos
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualización automática de datos ($(date -u +%F))"
            git stash push --include-untracked --quiet || true
            git pull --rebase origin main
            git push
          fi

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
